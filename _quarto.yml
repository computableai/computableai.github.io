project:
  type: website
  resources:
    - static
  post-render:
    - tools/legacy-feed.py

execute:
  enabled: false

website:
  title: "Computable AI"
  description: "A machine intelligence blog"
  site-url: "https://computable.ai"
  favicon: static/images/favicon.ico
  navbar:
    logo: static/images/brand/logo-disc.png
    logo-alt: "Computable AI logo"
    title: "Computable AI"
    right:
      - text: "About"
        href: about.qmd
      - icon: github
        href: https://github.com/computableai
        aria-label: GitHub
      - icon: rss
        href: index.xml
        aria-label: RSS feed
  search:
    location: navbar
    type: overlay
  page-footer:
    center: "© 2019–2026 Daniel Cox"

format:
  html:
    include-in-header:
      # Quarto 1.7 bug workaround: with a light/dark highlight-style map, the
      # inline color-scheme script does
      #   querySelector('link#quarto-text-highlighting-styles...').rel = ...
      # but that link is never emitted when token styles are embedded in the
      # theme bundles (our case). The null deref kills the script and with it
      # dark mode. A disabled dummy link satisfies the selector harmlessly.
      text: '<link id="quarto-text-highlighting-styles" class="quarto-color-scheme-extra" rel="disabled-stylesheet">'
    respect-user-color-scheme: true
    theme:
      light: [flatly, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    css: styles.css
    highlight-style:
      light: solarized
      dark: zenburn
    toc: true
    html-math-method: mathjax
